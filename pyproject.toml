[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-chat-mcp"
version = "2.0.0"
description = "A durable shared chat room for MCP clients"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[project.scripts]
agent-chat = "agent_chat:run"

[tool.setuptools]
py-modules = ["server", "agent_chat"]
